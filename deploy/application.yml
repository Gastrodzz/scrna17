# =============================================================================
# ShinyProxy configuration — one isolated Docker container per user session.
# =============================================================================
# ShinyProxy gives each logged-in user their OWN container with a HARD RAM/CPU
# cap, so one big 100k-cell dataset can never OOM the VPS or affect other users.
# `max-instances` acts as your queue/limit.
#
# Run ShinyProxy itself with:
#   docker run -d -v /var/run/docker.sock:/var/run/docker.sock \
#     -v $(pwd)/application.yml:/opt/shinyproxy/application.yml \
#     --net sp-net -p 8080:8080 openanalytics/shinyproxy:3.1.1
# (See deploy/README.md for the full walk-through.)

proxy:
  title: scRNA-seq Analysis Platform
  landing-page: /
  heartbeat-rate: 10000
  heartbeat-timeout: 60000
  port: 8080

  # --- Authentication -------------------------------------------------------
  # The app has its OWN login (SQLite users). Set ShinyProxy auth to 'none' so
  # you don't log in twice; the app gates access. For an extra outer gate during
  # private testing, switch to 'simple' and define users below.
  authentication: none
  # authentication: simple
  # admin-groups: admins
  # users:
  #   - name: admin
  #     password: CHANGE_ME
  #     groups: admins

  # --- Docker / container backend ------------------------------------------
  docker:
    internal-networking: true
    container-network: sp-net

  # --- App specification ----------------------------------------------------
  specs:
    - id: scrna
      display-name: scRNA-seq Analysis Platform
      description: Single-cell RNA-seq analysis workspace
      container-image: scrna-platform:latest
      port: 3838

      # Per-user resource caps — THE key to protecting the VPS.
      # Size these to (total VPS RAM) / (max concurrent users) with headroom.
      # Example for a 64 GB box and ~8 users: 7g each.
      container-memory-limit: "8g"
      container-cpu-limit: 2

      # Shared, persistent data volume: the SQLite auth DB + per-project session
      # RDS live here so accounts, projects, figures and tables survive restarts
      # and are the SAME across every user's container.
      container-volumes:
        - "/srv/scrna/data:/app/data"

      # Environment for each user's container.
      container-env:
        R_MAX_VSIZE: "48Gb"       # headroom for heavy R jobs within the cap
        SCRNA_PRODUCTION: "1"     # sanitise error messages shown to users
        # Move datasets >= threshold cells to on-disk (BPCells) storage to cut
        # RAM. Off by default; enable here if you want lower per-user RAM.
        # SCRNA_ONDISK: "1"
        # SCRNA_ONDISK_THRESHOLD: "50000"

  # --- Concurrency / queue --------------------------------------------------
  # Hard ceiling on simultaneous containers. Requests beyond this wait (queue).
  # Set to (VPS RAM - overhead) / container-memory-limit.
  max-instances: 8
  container-wait-time: 60000

server:
  servlet:
    context-path: /
  forward-headers-strategy: native

logging:
  file:
    name: /var/log/shinyproxy.log
